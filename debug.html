<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>2D Atlantic Forecast Debug</title>
  <link rel="stylesheet" href="style.css">
  <style>
    #log {
      background: #111;
      color: #0f0;
      font-family: monospace;
      padding: 10px;
      height: 300px;
      overflow-y: auto;
      border: 1px solid #444;
      margin-top: 1em;
    }
  </style>
</head>
<body>
  <h1>2D Atlantic Forecast Debug v2</h1>

  <button id="btn-test">Test 2D Atlantic Forecast</button>

  <div id="atlantic-2d-container" style="margin-top:1em;">
    <!-- Local placeholder; will be replaced with live NHC image -->
    <img id="twofig2d" name="twofig2d" alt="2D Atlantic Forecast"
         src="/xgtwo/two_atl_2d0.png" usemap="#twomap2d0" width="900" border="0">
  </div>

  <h2>Debug Log</h2>
  <div id="log"></div>

  <script type="module">
    import { initAtlantic2D } from "./scripts/atlantic2d.js";

    const logDiv = document.getElementById("log");
    function log(...args) {
      const msg = args.map(a => (typeof a === "object" ? JSON.stringify(a) : a)).join(" ");
      logDiv.innerHTML += msg + "<br>";
      logDiv.scrollTop = logDiv.scrollHeight;
      console.log(...args);
    }

    document.getElementById("btn-test").onclick = () => {
      log("[Debug] Initializing 2D Atlantic Forecast section…");
      try {
        initAtlantic2D();
        log("[Debug] #twofig2d image exists:", document.getElementById("twofig2d") !== null);
      } catch (err) {
        log("[Error]", err);
      }
    };
  </script>
</body>
</html>
