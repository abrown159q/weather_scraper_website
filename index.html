<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Weather Dashboard v3</h1>

  <!-- National Forecast Map -->
  <section id="national-forecast">
    <h2>National Forecast Map</h2>
    <div class="forecast-map">
      <img src="https://www.wpc.ncep.noaa.gov/noaa/national_forecast.jpg" alt="National Forecast">
    </div>
  </section>

  <!-- Max Temperature -->
  <section id="max-temp">
    <h2>Max Temperature (Today)</h2>
    <div class="forecast-map">
      <img src="https://graphical.weather.gov/images/conus/MaxT1_conus.png" alt="Max Temp">
    </div>
  </section>

  <!-- Local Forecast -->
  <section id="local-forecast">
    <h2>Local Forecast (South Bend, IN)</h2>
    <div id="forecast" class="forecast">Loading...</div>
  </section>

  <!-- Future modular sections can be added here with unique ids -->

  <script type="module" src="scripts/main.js"></script>
</body>
</html>
